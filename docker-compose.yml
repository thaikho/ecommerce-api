services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db_container
    restart: always
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ecom_user -d ecommerce_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ecommerce_api_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://ecom_user:ecom_pass@db:5432/ecommerce_db?schema=public"
      JWT_SECRET: "your_super_secret_jwt_key_here"
      JWT_EXPIRES_IN: "1d"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
